<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>구역 편성 관리 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        body { font-family: 'Noto Sans KR', sans-serif; overflow: hidden; user-select: none; }
        #map { width: 100%; height: 100%; }

        /* 주소/이름 등은 복사할 수 있도록 선택 허용 */
        #personList td, #selectionTags, input, textarea { user-select: text; }

        .list-row:hover { background-color: #f3f4f6; cursor: pointer; }
        .selected-row { background-color: #eff6ff !important; box-shadow: inset 4px 0 0 #2563eb; }
        .no-marker-row { background-color: #fff1f2; }

        .modal-overlay { background-color: rgba(0, 0, 0, 0.5); }
        input[type="checkbox"] { cursor: pointer; }

        th { white-space: nowrap; position: relative; overflow: hidden; text-overflow: ellipsis; }
        td { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        th[data-sort] { cursor: pointer; }
        th[data-sort]:hover { background-color: #f1f5f9; }

        .resizer {
            position: absolute; top: 0; right: 0; width: 4px; cursor: col-resize;
            user-select: none; height: 100%; background-color: transparent; z-index: 10;
        }
        .resizer:hover, .resizing { background-color: #3b82f6; width: 4px; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* 영역 선택 / 위치 지정 모드에서 지도 커서 */
        .map-crosshair, .map-crosshair * { cursor: crosshair !important; }

        /* 토스트 */
        #toastArea { position: fixed; bottom: 16px; right: 16px; z-index: 9999; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
        .toast { background: #1f2937; color: #fff; padding: 8px 14px; border-radius: 6px; font-size: 13px; box-shadow: 0 4px 12px rgba(0,0,0,.25); animation: toastIn .18s ease-out; }
        .toast.ok { background: #15803d; } .toast.warn { background: #b45309; } .toast.err { background: #b91c1c; }
        @keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

        .zone-center-label {
            background: rgba(255,255,255,.92); border: 1px solid #94a3b8; border-radius: 4px;
            padding: 1px 6px; font-size: 11px; font-weight: 700; color: #334155; white-space: nowrap;
            box-shadow: 0 1px 3px rgba(0,0,0,.2);
        }

        /* --- 반응형: 태블릿/폰에서는 상하 배치 --- */
        @media (max-width: 767px) {
            main { flex-direction: column !important; }
            #map-container { width: 100% !important; height: 38vh !important; flex: none !important; border-right: none !important; border-bottom: 1px solid #d1d5db; }
            #layout-resizer { display: none !important; }
            /* 폰에서는 우측 패널 전체를 하나로 스크롤시킨다 (섹션별 고정 높이를 쓰면 명단이 화면 밖으로 밀림) */
            #rightPanel { width: 100% !important; min-width: 0 !important; flex: 1 1 auto !important; height: auto !important; min-height: 0; overflow-y: auto !important; }
            #statsSection { height: auto !important; flex: 0 0 auto !important; max-height: 30vh; }
            #listContainer { flex: 0 0 auto !important; overflow: visible !important; min-height: 0 !important; }
            #listContainer > div:last-child { overflow: visible !important; flex: none !important; }
            #selectionSummaryPanel, #filterSection { position: sticky; z-index: 15; }
            #selectionSummaryPanel { top: 0; }
            header { height: auto !important; padding: 8px 12px !important; }
        }

        /* 인쇄 준비 중에는 지도를 A4 세로 비율로 만들어 타일을 미리 받아둔다 */
        @media screen {
            .printing #rightPanel, .printing #layout-resizer, .printing #mapToolbar { display: none !important; }
        }

        @media print {
            @page { size: A4 portrait; margin: 10mm; }
            body, html { height: auto !important; overflow: visible !important; background: white !important; }
            header, .no-print, .resizer, #statsSection, #selectionSummaryPanel, #filterSection,
            #mapToolbar, #areaPanel, #pinPanel, #toastArea, #progressBar, #exitFullscreenBtn { display: none !important; }
            #resizeTable th:first-child, #resizeTable td:first-child,
            #resizeTable th:last-child, #resizeTable td:last-child { display: none !important; }

            main { display: block !important; height: auto !important; overflow: visible !important; }

            /* 1쪽: 지도 — 인쇄 여백 제외 폭 190mm에 맞춘 190 x 250mm 고정 (화면에서 잡아둔 비율과 동일) */
            #map-container {
                display: block !important; position: relative !important;
                width: 100% !important; height: auto !important;
                page-break-after: always !important; border: none !important; margin: 0 !important;
            }
            #printMapTitle { display: block !important; text-align: center; margin-bottom: 4mm; }
            #map { width: 100% !important; height: 250mm !important; border: 1.5px solid #000 !important; }

            /* 2쪽부터: 명단 */
            #rightPanel, #listContainer {
                width: 100% !important; height: auto !important; border: none !important;
                box-shadow: none !important; display: block !important; overflow: visible !important;
                min-height: 0 !important; max-height: none !important;
            }
            #listContainer > div:last-child { overflow: visible !important; height: auto !important; }
            table { width: 100% !important; border-collapse: collapse !important; font-size: 10.5pt !important; table-layout: auto !important; }
            thead { display: table-header-group !important; }
            tbody { display: table-row-group !important; }
            tr { page-break-inside: avoid; }
            th, td { border: 1px solid #000 !important; padding: 5px !important; color: #000 !important; white-space: normal !important; }
            th { background: #f1f5f9 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            #printTitle { display: block !important; text-align: center; margin-bottom: 16px; }
        }
        #printTitle, #printMapTitle { display: none; }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col">

    <!-- ===================== 헤더 ===================== -->
    <header class="bg-white shadow-sm px-3 md:px-6 py-2 z-20 flex justify-between items-center gap-2 md:h-14 shrink-0 border-b no-print flex-wrap">
        <div class="flex items-center gap-2 md:gap-4 flex-wrap">
            <h1 class="text-base md:text-lg font-bold text-gray-800 flex items-center">
                <i class="fa-solid fa-map-location-dot text-blue-600 text-xl mr-2"></i>
                구역 편성
            </h1>
            <div class="hidden md:block h-6 w-px bg-gray-300"></div>
            <div class="flex items-center gap-1.5 flex-wrap">
                <button onclick="downloadSample()" title="엑셀 양식 내려받기" class="bg-gray-500 hover:bg-gray-600 text-white px-2.5 py-1.5 rounded text-sm transition shadow-sm">
                    <i class="fa-solid fa-file-arrow-down md:mr-2"></i><span class="hidden md:inline">양식</span>
                </button>
                <input type="file" id="excelFile" accept=".xlsx, .xls" class="hidden" onchange="handleFileUpload(event)">
                <label for="excelFile" title="엑셀 명단 업로드" class="bg-green-600 hover:bg-green-700 text-white px-2.5 py-1.5 rounded text-sm cursor-pointer transition shadow-sm">
                    <i class="fa-solid fa-file-excel md:mr-2"></i><span class="hidden md:inline">업로드</span>
                </label>
                <button onclick="exportToExcel()" title="엑셀로 저장 (좌표 포함)" class="bg-blue-600 hover:bg-blue-700 text-white px-2.5 py-1.5 rounded text-sm transition shadow-sm">
                    <i class="fa-solid fa-floppy-disk md:mr-2"></i><span class="hidden md:inline">저장</span>
                </button>
                <button onclick="addPerson()" title="인원 추가" class="bg-teal-600 hover:bg-teal-700 text-white px-2.5 py-1.5 rounded text-sm transition shadow-sm">
                    <i class="fa-solid fa-user-plus md:mr-2"></i><span class="hidden md:inline">추가</span>
                </button>
                <button onclick="printReport()" title="체크된 인원만 인쇄 (1쪽 지도 · 2쪽부터 명단)" class="bg-gray-700 hover:bg-gray-800 text-white px-2.5 py-1.5 rounded text-sm transition shadow-sm">
                    <i class="fa-solid fa-print md:mr-2"></i><span class="hidden md:inline">인쇄</span>
                </button>
                <button id="undoBtn" onclick="undo()" disabled title="실행 취소 (Ctrl+Z)" class="bg-white border border-gray-300 hover:bg-gray-100 disabled:opacity-40 disabled:cursor-not-allowed text-gray-700 px-2.5 py-1.5 rounded text-sm transition shadow-sm">
                    <i class="fa-solid fa-rotate-left md:mr-2"></i><span class="hidden md:inline">되돌리기</span>
                </button>
                <span id="statusMsg" class="text-xs text-gray-500 ml-1">준비됨</span>
            </div>
        </div>
        <div class="flex items-center gap-1.5 shrink-0">
            <button onclick="openSettings()" title="교구·구역 편성 / 색상 / 지도 표시 설정" class="text-xs bg-white border border-gray-300 hover:bg-blue-50 text-gray-600 px-3 py-1.5 rounded transition">
                <i class="fa-solid fa-gear mr-1 text-blue-500"></i>설정
            </button>
            <button onclick="resetAll()" class="text-xs bg-white border border-gray-300 hover:bg-red-50 text-gray-600 px-3 py-1.5 rounded transition">
                <i class="fa-solid fa-trash-can mr-1 text-red-400"></i>초기화
            </button>
        </div>
    </header>

    <!-- 진행률 바 -->
    <div id="progressBar" class="hidden h-1 bg-blue-100 shrink-0 no-print">
        <div id="progressFill" class="h-full bg-blue-600 transition-all duration-150" style="width:0%"></div>
    </div>

    <!-- ===================== 메인 ===================== -->
    <main class="flex flex-1 overflow-hidden">
        <!-- 좌측: 지도 -->
        <div id="map-container" class="h-full relative bg-gray-100 border-r" style="width: 65%;">
            <div id="printMapTitle">
                <div style="font-size:22px;font-weight:bold;">구역 배치도</div>
                <div id="printMapSubtitle" style="font-size:12px;font-weight:normal;margin-top:4px;"></div>
            </div>
            <div id="map"></div>

            <!-- 지도 도구막대 -->
            <div id="mapToolbar" class="absolute top-3 left-3 z-[100] flex flex-col gap-2 no-print">
                <div class="bg-white/95 backdrop-blur rounded-lg shadow-lg border p-1.5 flex flex-wrap gap-1 items-center">
                    <span class="text-[11px] font-bold text-gray-500 px-1 hidden sm:inline">영역 편성</span>
                    <button id="btnLasso" onclick="startArea('lasso')" title="마우스로 자유롭게 감싸기 (PC)" class="px-2 py-1 rounded text-xs border bg-white hover:bg-blue-50 text-gray-700">
                        <i class="fa-solid fa-draw-polygon mr-1"></i>올가미
                    </button>
                    <button id="btnPoly" onclick="startArea('poly')" title="지도를 탭/클릭해 꼭짓점 찍기 (모바일 가능)" class="px-2 py-1 rounded text-xs border bg-white hover:bg-blue-50 text-gray-700">
                        <i class="fa-solid fa-location-dot mr-1"></i>다각형
                    </button>
                    <button id="btnClearArea" onclick="clearArea()" title="그린 영역 지우기" class="px-2 py-1 rounded text-xs border bg-white hover:bg-red-50 text-gray-500">
                        <i class="fa-solid fa-eraser"></i>
                    </button>
                    <div class="w-px h-5 bg-gray-300 mx-0.5"></div>
                    <button id="btnZoneCenter" onclick="toggleZoneCenters()" title="구역 중심점 표시" class="px-2 py-1 rounded text-xs border bg-white hover:bg-blue-50 text-gray-700">
                        <i class="fa-solid fa-crosshairs mr-1"></i>중심점
                    </button>
                    <button onclick="fitToVisible()" title="표시된 인원에 맞춰 지도 이동" class="px-2 py-1 rounded text-xs border bg-white hover:bg-blue-50 text-gray-700">
                        <i class="fa-solid fa-expand-arrows-alt"></i>
                    </button>
                    <button onclick="toggleMapFullscreen()" title="지도 전체화면" class="px-2 py-1 rounded text-xs border bg-white hover:bg-purple-50 text-purple-700">
                        <i class="fa-solid fa-expand"></i>
                    </button>
                </div>

                <!-- 영역 그리기 안내 패널 -->
                <div id="areaPanel" class="hidden bg-blue-600 text-white rounded-lg shadow-lg p-2.5 text-xs max-w-[280px]">
                    <div id="areaHint" class="mb-2 leading-relaxed"></div>
                    <div class="flex gap-1.5">
                        <button onclick="finishArea()" class="flex-1 bg-white text-blue-700 font-bold px-2 py-1 rounded hover:bg-blue-50">완료</button>
                        <button onclick="cancelArea()" class="flex-1 bg-blue-800 text-white px-2 py-1 rounded hover:bg-blue-900">취소</button>
                    </div>
                </div>

                <!-- 수동 위치 지정 안내 -->
                <div id="pinPanel" class="hidden bg-amber-500 text-white rounded-lg shadow-lg p-2.5 text-xs max-w-[280px]">
                    <div id="pinHint" class="mb-2 leading-relaxed"></div>
                    <button onclick="cancelPinMode()" class="w-full bg-amber-700 px-2 py-1 rounded hover:bg-amber-800">취소</button>
                </div>
            </div>

            <button id="exitFullscreenBtn" onclick="toggleMapFullscreen()" class="hidden absolute top-4 right-4 z-[9999] bg-white hover:bg-gray-100 text-gray-800 px-4 py-2 rounded shadow-lg border text-sm font-bold transition">
                <i class="fa-solid fa-compress mr-2"></i>원래대로
            </button>
        </div>

        <!-- 좌우 경계선 -->
        <div id="layout-resizer" class="w-1.5 bg-gray-300 hover:bg-blue-500 cursor-col-resize z-40 flex-shrink-0 relative no-print transition-colors group" title="드래그하여 크기 조절">
            <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 h-8 w-0.5 bg-gray-500 group-hover:bg-white rounded"></div>
        </div>

        <!-- 우측: 패널 -->
        <div id="rightPanel" class="flex-1 flex flex-col bg-white h-full shadow-xl z-30 md:min-w-[300px] overflow-hidden">
            <div id="printTitle">
                <div style="font-size:22px;font-weight:bold;">구역 현황 명단</div>
                <div id="printSubtitle" style="font-size:12px;font-weight:normal;margin-top:4px;"></div>
            </div>

            <!-- 1. 조직 통계 -->
            <div id="statsSection" class="h-[35%] flex flex-col border-b bg-white no-print shrink-0">
                <div class="p-2.5 border-b bg-gray-50 font-bold text-gray-700 text-sm flex justify-between items-center gap-2">
                    <button onclick="toggleStatsCollapse()" class="flex items-center gap-2 hover:text-blue-600">
                        <i id="statsChevron" class="fa-solid fa-chevron-down text-xs text-gray-400"></i>
                        <i class="fa-solid fa-sitemap text-blue-500"></i>
                        <span>조직 통계</span>
                    </button>
                    <div class="flex items-center gap-2">
                        <span id="noLocBadge" class="hidden text-[11px] font-normal bg-red-50 border border-red-200 text-red-600 px-2 py-0.5 rounded cursor-pointer hover:bg-red-100" onclick="showNoLocation()" title="위치를 찾지 못한 인원 보기"></span>
                        <div class="flex items-center gap-1">
                            <input type="checkbox" id="statsCheckAll" onchange="toggleAll(this.checked)" checked class="rounded text-blue-600 focus:ring-0">
                            <label for="statsCheckAll" class="text-xs font-normal text-gray-500 cursor-pointer">전체</label>
                        </div>
                        <span class="text-xs font-normal bg-white border px-2 py-0.5 rounded text-gray-500">총 <span id="totalCount">0</span>명</span>
                    </div>
                </div>
                <div id="statsTreeContainer" class="flex-1 overflow-y-auto p-2 space-y-2">
                    <div class="text-center py-10 text-gray-400 text-xs">데이터를 업로드하세요.</div>
                </div>
            </div>

            <!-- 2. 선택 요약 + 일괄 편집 -->
            <div id="selectionSummaryPanel" class="bg-blue-50 border-b border-blue-100 p-2 shrink-0 text-xs no-print">
                <div class="flex justify-between items-center mb-1 gap-2">
                    <span class="font-bold text-blue-800"><i class="fa-solid fa-check-double mr-1"></i>체크된 인원 <span id="selectedCount">0</span>명</span>
                    <div class="flex gap-1">
                        <button onclick="openBulkModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-2 py-1 rounded font-bold shadow-sm">
                            <i class="fa-solid fa-users-gear mr-1"></i>일괄 편성
                        </button>
                        <button onclick="deleteChecked()" class="bg-white border border-red-200 hover:bg-red-50 text-red-600 px-2 py-1 rounded" title="체크된 인원 삭제">
                            <i class="fa-solid fa-user-minus"></i>
                        </button>
                    </div>
                </div>
                <div id="selectionTags" class="flex flex-wrap gap-1 max-h-[44px] overflow-y-auto text-[10px]">
                    <span class="text-gray-400 px-1">없음</span>
                </div>
            </div>

            <!-- 3. 인원 명단 -->
            <div id="listContainer" class="flex-1 flex flex-col overflow-hidden min-h-0">
                <div id="filterSection" class="p-2 bg-gray-100 border-b flex flex-col gap-2 no-print shrink-0">
                    <div class="flex gap-2 text-xs">
                        <select id="filterParish" onchange="onParishFilterChange()" class="border rounded px-2 py-1 flex-1 bg-white min-w-0">
                            <option value="">전체 교구</option>
                        </select>
                        <select id="filterZone" onchange="applyListFilter()" class="border rounded px-2 py-1 flex-1 bg-white min-w-0">
                            <option value="">전체 구역</option>
                        </select>
                        <select id="filterGroup" onchange="applyListFilter()" class="border rounded px-2 py-1 flex-1 bg-white min-w-0">
                            <option value="">전체 소속</option>
                        </select>
                    </div>
                    <div class="flex gap-2 text-xs items-center">
                        <div class="relative flex-1 min-w-0">
                            <i class="fa-solid fa-magnifying-glass absolute left-2 top-1.5 text-gray-400"></i>
                            <input type="text" id="filterName" onkeyup="applyListFilter()" placeholder="이름 · 주소 · 직분 검색" class="w-full border rounded pl-7 pr-2 py-1">
                        </div>
                        <label class="flex items-center gap-1 whitespace-nowrap text-gray-600">
                            <input type="checkbox" id="filterNoLoc" onchange="applyListFilter()" class="rounded text-red-600 focus:ring-0">위치없음
                        </label>
                        <label class="flex items-center gap-1 whitespace-nowrap text-gray-600">
                            <input type="checkbox" id="listCheckAll" onchange="toggleListVisible(this.checked)" checked class="rounded text-blue-600 focus:ring-0">목록선택
                        </label>
                    </div>
                    <div class="text-[11px] text-gray-500 flex justify-between">
                        <span id="listCountLabel">0명 표시</span>
                        <button onclick="clearFilters()" class="text-blue-600 hover:underline">필터 해제</button>
                    </div>
                </div>

                <div class="flex-1 overflow-y-auto overflow-x-auto min-h-0">
                    <table id="resizeTable" class="w-full text-sm text-left border-collapse table-fixed min-w-[440px]">
                        <thead class="text-xs text-gray-500 uppercase bg-white sticky top-0 z-10 shadow-sm select-none">
                            <tr>
                                <th class="px-2 py-2 border-b w-8 text-center no-print"><i class="fa-solid fa-check text-gray-300"></i></th>
                                <th class="px-2 py-2 border-b" data-col="parish_zone" data-sort="parish_zone">교구/구역<span class="sort-ind"></span><div class="resizer no-print"></div></th>
                                <th class="px-2 py-2 border-b" data-col="name" data-sort="name">이름<span class="sort-ind"></span><div class="resizer no-print"></div></th>
                                <th class="px-2 py-2 border-b" data-col="role" data-sort="role">직분<span class="sort-ind"></span><div class="resizer no-print"></div></th>
                                <th class="px-2 py-2 border-b" data-col="address" data-sort="address">주소<span class="sort-ind"></span><div class="resizer no-print"></div></th>
                                <th class="px-2 py-2 border-b w-14 text-center" data-sort="attendance">출석<span class="sort-ind"></span><div class="resizer no-print"></div></th>
                                <th class="px-2 py-2 border-b w-10 text-center no-print"><i class="fa-solid fa-pen-to-square"></i></th>
                            </tr>
                        </thead>
                        <tbody id="personList" class="divide-y divide-gray-100"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- ===================== 개별 수정 모달 ===================== -->
    <div id="editModal" class="fixed inset-0 z-50 hidden items-center justify-center modal-overlay no-print p-4">
        <div class="bg-white rounded-lg shadow-lg w-full max-w-[420px] p-5 relative max-h-[92vh] overflow-y-auto">
            <h3 id="editModalTitle" class="text-lg font-bold text-gray-800 mb-4 border-b pb-2"><i class="fa-solid fa-user-pen mr-2 text-blue-600"></i>정보 수정</h3>
            <input type="hidden" id="editId">
            <div class="space-y-3 text-sm">
                <div class="grid grid-cols-2 gap-3">
                    <div><label class="block text-gray-600 mb-1">이름</label><input type="text" id="editName" class="w-full border rounded px-2 py-1.5"></div>
                    <div><label class="block text-gray-600 mb-1">직분</label><input type="text" id="editRole" class="w-full border rounded px-2 py-1.5"></div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-gray-600 mb-1">교구</label>
                        <input type="text" id="editParish" list="parishOptions" class="w-full border rounded px-2 py-1.5">
                    </div>
                    <div>

    <datalist id="parishOptions"></datalist>
    <datalist id="zoneOptions"></datalist>

    <div id="toastArea" class="no-print"></div>

    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=1d9268593ca620c81ee6929f1f2de6a3&libraries=services&autoload=false"></script>

    <script>
    /* =========================================================================
       구역 편성 관리 시스템
       ========================================================================= */

    // ------------------------- 보안(우클릭/개발자도구 억제) -------------------------
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', function (e) {
        if (e.key === 'F12') { e.preventDefault(); return; }
        const k = (e.key || '').toUpperCase();
        if ((e.ctrlKey && e.shiftKey && ['I', 'C', 'J'].includes(k)) || (e.ctrlKey && k === 'U')) {
            e.preventDefault();
        }
        // Ctrl+Z 실행 취소 (입력창에서는 기본 동작 유지)
        if (e.ctrlKey && k === 'Z' && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) {
            e.preventDefault(); undo();
        }
        if (e.key === 'Escape') {
            if (areaMode) cancelArea();
            else if (pinTargetId !== null) cancelPinMode();
            else { closeEditModal(); closeBulkModal(); hideModal('settingsModal'); }
        }
    });

    // ------------------------------- 유틸 -------------------------------
    const S = v => (v === undefined || v === null) ? '' : String(v).trim();          // 엑셀 숫자/불린 안전 변환
    const esc = s => S(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    function natCmp(a, b) {                                                          // 2구역 < 10구역 자연 정렬
        const na = parseInt(S(a).replace(/[^0-9]/g, ''), 10);
        const nb = parseInt(S(b).replace(/[^0-9]/g, ''), 10);
        if (!isNaN(na) && !isNaN(nb) && na !== nb) return na - nb;
        return S(a).localeCompare(S(b), 'ko');
    }

    function toast(msg, type) {
        const el = document.createElement('div');
        el.className = 'toast ' + (type || '');
        el.innerText = msg;
        document.getElementById('toastArea').appendChild(el);
        setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 300); }, 2600);
    }

    function setStatus(text) { document.getElementById('statusMsg').innerText = text; }

    function setProgress(done, total) {
        const bar = document.getElementById('progressBar');
        const fill = document.getElementById('progressFill');
        if (total <= 0 || done >= total) { bar.classList.add('hidden'); fill.style.width = '0%'; return; }
        bar.classList.remove('hidden');
        fill.style.width = Math.round(done / total * 100) + '%';
    }

    function haversine(lat1, lng1, lat2, lng2) {                                     // 미터 단위 거리
        const R = 6371000, toRad = d => d * Math.PI / 180;
        const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
        const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
        return 2 * R * Math.asin(Math.sqrt(a));
    }

    function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

    /** 동시 실행 개수를 제한한 비동기 처리 */
    async function runPool(items, limit, worker, onProgress) {
        let cursor = 0, done = 0;
        const runners = Array.from({ length: Math.min(limit, items.length) }, async () => {
            while (cursor < items.length) {
                const i = cursor++;
                try { await worker(items[i], i); } catch (e) { /* 개별 실패는 무시 */ }
                done++;
                if (onProgress) onProgress(done, items.length);
            }
        });
        await Promise.all(runners);
    }

    // ------------------------------- 전역 상태 -------------------------------
    let map, geocoder, places;
    let allData = [];
    let stats = {};
    let selectedMarker = null;
    let nextId = 1;
    let geoCache = {};                       // { 주소: {lat,lng} }
    let collapsedParishes = new Set();
    let sortKey = null, sortDir = 1;
    let undoStack = [];
    const UNDO_LIMIT = 30;

    const LS_DATA = 'zone_mgr_data_v2';
    const LS_GEO = 'zone_mgr_geocache_v2';
    const LS_SET = 'zone_mgr_settings_v1';

    /** 사용자 설정 (설정 모달에서 변경, localStorage에 보존) */
    function defaultSettings() {
        return { parishCount: 8, zoneCount: 5, parishColors: {}, showEmptyZones: false, markerLabel: 'zone' };
    }
    let settings = defaultSettings();

    function loadSettings() {
        try {
            const s = JSON.parse(localStorage.getItem(LS_SET) || 'null');
            if (s) settings = Object.assign(defaultSettings(), s);
        } catch (e) { }
    }
    function persistSettings() {
        try { localStorage.setItem(LS_SET, JSON.stringify(settings)); } catch (e) { }
    }

    const FIXED_COLORS = {
        '1교구': { h: 220, s: 90, l: 50 }, '2교구': { h: 0, s: 90, l: 50 },
        '3교구': { h: 120, s: 90, l: 40 }, '4교구': { h: 45, s: 100, l: 50 },
        '5교구': { h: 270, s: 90, l: 60 }, '6교구': { h: 330, s: 90, l: 60 },
        '7교구': { h: 240, s: 100, l: 30 }, '8교구': { h: 30, s: 100, l: 50 }
    };
    let dynamicColors = {};

    // ------------------------------- 초기화 -------------------------------
    window.onload = function () {
        loadSettings();
        loadGeoCache();
        initTableResizer();
        initLayoutResizer();
        initTableSort();
        initListDelegation();
        initStatsDelegation();

        // 지도 로딩과 무관하게 먼저 복원한다. (지도가 실패해도 명단·통계·인쇄는 쓸 수 있어야 한다)
        restoreFromStorage();

        const timer = setInterval(() => {
            if (window.kakao && window.kakao.maps) {
                clearInterval(timer);
                kakao.maps.load(function () {
                    map = new kakao.maps.Map(document.getElementById('map'), {
                        center: new kakao.maps.LatLng(37.6584, 126.8320),  // 고양시 일대
                        level: 6
                    });
                    geocoder = new kakao.maps.services.Geocoder();
                    places = new kakao.maps.services.Places();
                    initMapEvents();
                    onMapReady();
                });
            }
        }, 100);

        setTimeout(() => {
            clearInterval(timer);
            if (!map) toast('카카오맵을 불러오지 못했습니다. 명단·통계·인쇄는 그대로 쓸 수 있지만 지도 기능은 동작하지 않습니다.', 'err');
        }, 8000);
    };

    /** 지도가 준비된 뒤, 이미 복원된 데이터에 마커를 붙인다. */
    function onMapReady() {
        allData.forEach(syncMarker);
        if (allData.some(p => p.lat != null)) fitToVisible();
        if (showZoneCenters) renderZoneCenters();
    }

    // ------------------------------- 색상 -------------------------------
    function getParishColorInfo(parishName) {
        const key = S(parishName);
        if (settings.parishColors[key]) return hexToHsl(settings.parishColors[key]);   // 설정에서 고른 색이 최우선
        if (FIXED_COLORS[key]) return FIXED_COLORS[key];
        if (dynamicColors[key]) return dynamicColors[key];
        dynamicColors[key] = { h: hashHue(key), s: 70, l: 50 };
        return dynamicColors[key];
    }

    function hashHue(key) {
        let hash = 0;
        for (let i = 0; i < key.length; i++) hash = key.charCodeAt(i) + ((hash << 5) - hash);
        return Math.abs(hash % 360);
    }

    /** 설정 모달의 컬러피커 기본값 */
    function defaultColorHex(parishName) {
        const c = FIXED_COLORS[S(parishName)];
        return c ? hslToHex(c.h, c.s, c.l) : hslToHex(hashHue(S(parishName)), 70, 50);
    }

    function hexToHsl(hex) {
        let x = S(hex).replace('#', '');
        if (x.length === 3) x = x.split('').map(c => c + c).join('');
        const r = parseInt(x.slice(0, 2), 16) / 255, g = parseInt(x.slice(2, 4), 16) / 255, b = parseInt(x.slice(4, 6), 16) / 255;
        const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
        const l = (max + min) / 2;
        let h = 0, s = 0;
        if (d) {
            s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
            if (max === r) h = (g - b) / d + (g < b ? 6 : 0);
            else if (max === g) h = (b - r) / d + 2;
            else h = (r - g) / d + 4;
            h *= 60;
        }
        return { h: Math.round(h), s: Math.round(s * 100), l: Math.round(l * 100) };
    }

    function getMarkerColor(parish, zone) {
        const base = getParishColorInfo(parish);
        const m = S(zone).match(/\d+/);
        const zNum = m ? parseInt(m[0], 10) : 1;
        const lightness = Math.max(25, Math.min(80, base.l + (zNum - 1) * 9));
        return { hex: hslToHex(base.h, base.s, lightness), baseHex: hslToHex(base.h, base.s, base.l) };
    }

    function hslToHex(h, s, l) {
        l /= 100;
        const a = s * Math.min(l, 1 - l) / 100;
        const f = n => {
            const k = (n + h / 30) % 12;
            const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
            return Math.round(255 * color).toString(16).padStart(2, '0');
        };
        return `#${f(0)}${f(8)}${f(4)}`;
    }

    // ------------------------------- 마커 -------------------------------
    function makeMarkerText(zone) {
        const z = S(zone);
        const m = z.match(/\d+/);
        if (m) return m[0];
        const t = z.replace(/구역|미지정/g, '').trim();
        return t ? t.slice(0, 2) : '·';
    }

    const PIN_W = 35, PIN_H = 45;
    const measureCtx = document.createElement('canvas').getContext('2d');

    /** 핀(구역번호) + 선택적 이름표. label이 없으면 기존과 동일한 35x45 핀. */
    function createSvgMarker(color, text, highlight, label) {
        const t = S(text) || '·';
        const fs = t.length >= 2 ? 8 : 10;
        const stroke = highlight ? '#111827' : '#ffffff';
        const sw = highlight ? 2 : 1;

        // 24x24 좌표계의 핀을 35x45 픽셀 좌표계로 늘려 그린다
        const pin = `<g transform="scale(${PIN_W / 24},${PIN_H / 24})">`
            + `<path fill="${color}" stroke="${stroke}" stroke-width="${sw}" d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>`
            + `<circle cx="12" cy="9" r="4" fill="rgba(0,0,0,0.12)"/>`
            + `<text x="12" y="${fs === 8 ? 12 : 13}" font-size="${fs}" font-weight="bold" fill="white" text-anchor="middle" font-family="sans-serif">${esc(t)}</text>`
            + `</g>`;

        let inner = pin, w = PIN_W;
        const lab = S(label);
        if (lab) {
            const labFs = 12;
            measureCtx.font = `bold ${labFs}px 'Malgun Gothic','Noto Sans KR',sans-serif`;
            const textW = Math.ceil(measureCtx.measureText(lab).width);
            const boxW = textW + 12;
            w = PIN_W - 2 + boxW;
            inner += `<rect x="${PIN_W - 2}" y="6" rx="4" ry="4" width="${boxW}" height="20" fill="#ffffff" fill-opacity="0.95" stroke="${highlight ? '#111827' : color}" stroke-width="1.5"/>`
                + `<text x="${PIN_W - 2 + boxW / 2}" y="20" font-size="${labFs}" font-weight="bold" fill="#1f2937" text-anchor="middle" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">${esc(lab)}</text>`;
        }

        const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${PIN_H}" width="${w}" height="${PIN_H}">${inner}</svg>`;
        return new kakao.maps.MarkerImage(
            'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg),
            new kakao.maps.Size(w, PIN_H), { offset: new kakao.maps.Point(17, PIN_H) }
        );
    }

    /** 설정에 따라 마커 옆에 붙일 이름표 (없으면 빈 문자열) */
    function markerLabelFor(person) {
        return settings.markerLabel === 'zone_name' ? person.name : '';
    }

    /** 좌표가 있는 인원의 마커를 생성/갱신한다. */
    function syncMarker(person) {
        if (!map) return;
        if (person.lat == null || person.lng == null) {
            if (person.marker) { person.marker.setMap(null); person.marker = null; }
            return;
        }
        const label = markerLabelFor(person);
        const img = createSvgMarker(getMarkerColor(person.parish, person.zone).hex, person.markerText, false, label);
        person.originalImage = img;
        if (!person.marker) {
            person.marker = new kakao.maps.Marker({ position: new kakao.maps.LatLng(person.lat, person.lng), zIndex: 1 });
            kakao.maps.event.addListener(person.marker, 'click', () => highlightPerson(person.id));
        } else {
            person.marker.setPosition(new kakao.maps.LatLng(person.lat, person.lng));
        }
        if (selectedMarker === person.marker) {
            person.marker.setImage(createSvgMarker('#111827', person.markerText, true, label));
            person.marker.setZIndex(999);
        } else {
            person.marker.setImage(img);
        }
        person.marker.setTitle(`${person.name} (${person.group})`);
        person.marker.setMap(person.checked ? map : null);
    }

    function updateMarkerVisibility(person) {
        if (person.marker) person.marker.setMap(person.checked ? map : null);
    }

    // ------------------------------- 지오코딩 -------------------------------
    function loadGeoCache() {
        try { geoCache = JSON.parse(localStorage.getItem(LS_GEO) || '{}'); } catch (e) { geoCache = {}; }
    }
    const saveGeoCache = debounce(() => {
        try { localStorage.setItem(LS_GEO, JSON.stringify(geoCache)); } catch (e) { }
    }, 800);

    /** 주소 → 좌표. 도로명/지번 검색 실패 시 장소(키워드) 검색으로 재시도. */
    async function geocode(address) {
        const key = S(address);
        if (!key) return null;
        if (geoCache[key]) return geoCache[key];

        const byAddress = await new Promise(res => {
            geocoder.addressSearch(key, (result, status) => {
                if (status === kakao.maps.services.Status.OK && result.length) {
                    res({ lat: parseFloat(result[0].y), lng: parseFloat(result[0].x) });
                } else res(null);
            });
        });
        if (byAddress) { geoCache[key] = byAddress; saveGeoCache(); return byAddress; }

        const byKeyword = await new Promise(res => {
            if (!places) return res(null);
            places.keywordSearch(key, (data, status) => {
                if (status === kakao.maps.services.Status.OK && data.length) {
                    res({ lat: parseFloat(data[0].y), lng: parseFloat(data[0].x) });
                } else res(null);
            });
        });
        if (byKeyword) { geoCache[key] = byKeyword; saveGeoCache(); return byKeyword; }
        return null;
    }

    function handleFileUpload(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (e) {
            try {
                const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
                const json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' });
                if (!json.length) { toast('시트에 데이터가 없습니다.', 'warn'); return; }
                processData(json);
            } catch (err) { toast('엑셀 읽기 오류: ' + err.message, 'err'); }
        };
        reader.readAsArrayBuffer(file);
        event.target.value = '';
    }

    // ------------------------------- 데이터 처리 -------------------------------
    function normalizeAttendance(v) {
        const s = S(v).toUpperCase();
        return ['O', '0', 'ㅇ', 'Y', 'YES', 'TRUE', '1', '출석'].includes(s) ? 'O' : 'X';
    }

    function makePerson(row) {
        const zone = S(row['구역']) || '미지정';
        const lat = parseFloat(row['위도']), lng = parseFloat(row['경도']);
        return {
            id: nextId++,
            name: S(row['이름']) || '미상',
            address: S(row['주소']),
            parish: S(row['교구']) || '미지정',
            zone,
            group: S(row['소속']) || '기타',
            role: S(row['직분']) || '-',
            attendance: normalizeAttendance(row['출석여부']),
            lat: isFinite(lat) && lat !== 0 ? lat : null,
            lng: isFinite(lng) && lng !== 0 ? lng : null,
            marker: null,
            markerText: makeMarkerText(zone),
            checked: true
        };
    }

    async function processData(rows) {
        allData.forEach(p => { if (p.marker) p.marker.setMap(null); });
        allData = [];
        dynamicColors = {};
        selectedMarker = null;
        nextId = 1;
        undoStack = []; refreshUndoBtn();

        allData = rows.map(makePerson);

        // 좌표가 이미 있거나 주소가 없는 사람은 지오코딩 대상에서 제외. 지도가 죽었으면 주소 검색만 건너뛴다.
        const targets = geocoder ? allData.filter(p => p.lat == null && p.address) : [];
        const reused = allData.filter(p => p.lat != null).length;
        if (!geocoder) toast('지도를 불러오지 못해 주소 검색을 건너뛰었습니다. 명단은 정상 표시됩니다.', 'warn');

        if (targets.length) {
            setStatus(`주소 검색 중... 0/${targets.length}`);
            await runPool(targets, 5, async (p) => {
                const r = await geocode(p.address);
                if (r) { p.lat = r.lat; p.lng = r.lng; }
            }, (done, total) => {
                setStatus(`주소 검색 중... ${done}/${total}`);
                setProgress(done, total);
            });
            setProgress(1, 1);
        }

        allData.forEach(syncMarker);
        sortDataDefault();

        const failed = allData.filter(p => p.lat == null).length;
        setStatus(`완료 · 총 ${allData.length}명` + (reused ? ` (좌표 재사용 ${reused})` : ''));
        toast(`${allData.length}명 불러왔습니다.` + (failed ? ` 위치 미확인 ${failed}명` : ''), failed ? 'warn' : 'ok');

        populateFilters();
        updateStatsAndUI();
        adjustColumnWidths();
        if (map) fitToVisible();
        saveToStorage();
    }

    /** 초기 정렬: 교구 → 구역 → 이름 */
    function sortDataDefault() {
        allData.sort((a, b) => natCmp(a.parish, b.parish) || natCmp(a.zone, b.zone) || a.name.localeCompare(b.name, 'ko'));
    }

    // ------------------------------- 필터 -------------------------------
    function fillSelect(sel, values, keepFirstLabel) {
        const prev = sel.value;
        while (sel.options.length > 1) sel.remove(1);
        values.forEach(v => {
            const opt = document.createElement('option');
            opt.value = v; opt.textContent = v;
            sel.appendChild(opt);
        });
        sel.value = values.includes(prev) ? prev : '';
    }

    function fillDatalist(id, values) {
        const dl = document.getElementById(id);
        dl.innerHTML = '';
        values.forEach(v => {
            const o = document.createElement('option');
            o.value = v; dl.appendChild(o);
        });
    }

    function populateFilters() {
        const parishes = [...new Set(allData.map(p => p.parish))].sort(natCmp);
        const groups = [...new Set(allData.map(p => p.group))].sort(natCmp);
        fillSelect(document.getElementById('filterParish'), parishes);
        fillSelect(document.getElementById('filterGroup'), groups);
        refreshZoneFilterOptions();

        // 수정·일괄 편성 창의 추천 목록: 설정에서 정한 편성 규모 + 명단에 실제로 있는 이름
        const zones = [...new Set(allData.map(p => p.zone))];
        fillDatalist('parishOptions', [...new Set([...settingsParishNames(), ...parishes])].sort(natCmp));
        fillDatalist('zoneOptions', [...new Set([...settingsZoneNames(), ...zones])].sort(natCmp));
        fillDatalist('groupOptions', groups);
    }

    /** 선택된 교구에 속한 구역만 보여준다(연동 필터). */
    function refreshZoneFilterOptions() {
        const pFilter = document.getElementById('filterParish').value;
        const zones = [...new Set(allData.filter(p => !pFilter || p.parish === pFilter).map(p => p.zone))].sort(natCmp);
        fillSelect(document.getElementById('filterZone'), zones);
    }

    function onParishFilterChange() { refreshZoneFilterOptions(); applyListFilter(); }

    function clearFilters() {
        document.getElementById('filterParish').value = '';
        document.getElementById('filterGroup').value = '';
        document.getElementById('filterName').value = '';
        document.getElementById('filterNoLoc').checked = false;
        refreshZoneFilterOptions();
        applyListFilter();
    }

    function getFilteredData() {
        const pF = document.getElementById('filterParish').value;
        const zF = document.getElementById('filterZone').value;
        const gF = document.getElementById('filterGroup').value;
        const q = document.getElementById('filterName').value.trim().toLowerCase();
        const noLoc = document.getElementById('filterNoLoc').checked;

        return allData.filter(p => {
            if (pF && p.parish !== pF) return false;
            if (zF && p.zone !== zF) return false;
            if (gF && p.group !== gF) return false;
            if (noLoc && p.lat != null) return false;
            if (q) {
                const hay = (p.name + ' ' + p.address + ' ' + p.role + ' ' + p.group).toLowerCase();
                if (!hay.includes(q)) return false;
            }
            return true;
        });
    }

    function applyListFilter() {
        let filtered = getFilteredData();
        if (sortKey) filtered = filtered.slice().sort((a, b) => compareBy(sortKey, a, b) * sortDir);
        renderPersonList(filtered);
        document.getElementById('listCountLabel').innerText = `${filtered.length}명 표시 / 전체 ${allData.length}명`;
        document.getElementById('listCheckAll').checked = filtered.length > 0 && filtered.every(p => p.checked);
    }

    function showNoLocation() {
        clearFilters();
        document.getElementById('filterNoLoc').checked = true;
        applyListFilter();
    }

    // ------------------------------- 정렬(컬럼 헤더) -------------------------------
    /** 교구/구역은 반드시 각각 비교해야 한다. ('2교구 10구역'을 한 문자열로 보면 210이 되어 순서가 깨짐) */
    function compareBy(key, a, b) {
        switch (key) {
            case 'parish_zone':
                return natCmp(a.parish, b.parish) || natCmp(a.zone, b.zone) || a.name.localeCompare(b.name, 'ko');
            case 'name': return a.name.localeCompare(b.name, 'ko');
            case 'role': return a.role.localeCompare(b.role, 'ko') || a.name.localeCompare(b.name, 'ko');
            case 'address': return a.address.localeCompare(b.address, 'ko') || a.name.localeCompare(b.name, 'ko');
            case 'attendance': return a.attendance.localeCompare(b.attendance) || a.name.localeCompare(b.name, 'ko');
        }
        return 0;
    }

    function initTableSort() {
        document.querySelectorAll('#resizeTable th[data-sort]').forEach(th => {
            th.addEventListener('click', e => {
                if (e.target.classList.contains('resizer')) return;
                const key = th.getAttribute('data-sort');
                if (sortKey === key) sortDir = -sortDir; else { sortKey = key; sortDir = 1; }
                document.querySelectorAll('#resizeTable .sort-ind').forEach(s => s.innerHTML = '');
                th.querySelector('.sort-ind').innerHTML =
                    ` <i class="fa-solid fa-caret-${sortDir > 0 ? 'up' : 'down'} text-blue-500"></i>`;
                applyListFilter();
            });
        });
    }

    // ------------------------------- 통계 -------------------------------
    function updateStatsAndUI() {
        stats = {};
        allData.forEach(p => {
            const P = stats[p.parish] || (stats[p.parish] = { total: 0, zones: {} });
            P.total++;
            const Z = P.zones[p.zone] || (P.zones[p.zone] = { total: 0, groups: {}, pts: [] });
            Z.total++;
            Z.groups[p.group] = (Z.groups[p.group] || 0) + 1;
            if (p.lat != null) Z.pts.push([p.lat, p.lng]);
        });

        // 설정에서 켜면 인원이 0명인 교구·구역도 자리를 만들어 둔다 (편성 중 빈 자리 확인용)
        if (settings.showEmptyZones) {
            for (let i = 1; i <= settings.parishCount; i++) {
                const pn = `${i}교구`;
                const P = stats[pn] || (stats[pn] = { total: 0, zones: {} });
                for (let j = 1; j <= settings.zoneCount; j++) {
                    const zn = `${j}구역`;
                    if (!P.zones[zn]) P.zones[zn] = { total: 0, groups: {}, pts: [] };
                }
            }
        }

        // 구역별 중심점 / 평균 반경
        Object.values(stats).forEach(P => Object.values(P.zones).forEach(Z => {
            if (!Z.pts.length) { Z.center = null; Z.avgDist = null; return; }
            const cLat = Z.pts.reduce((s, q) => s + q[0], 0) / Z.pts.length;
            const cLng = Z.pts.reduce((s, q) => s + q[1], 0) / Z.pts.length;
            Z.center = [cLat, cLng];
            Z.avgDist = Z.pts.reduce((s, q) => s + haversine(cLat, cLng, q[0], q[1]), 0) / Z.pts.length;
        }));

        document.getElementById('totalCount').innerText = allData.length;
        const noLoc = allData.filter(p => p.lat == null).length;
        const badge = document.getElementById('noLocBadge');
        if (noLoc) { badge.classList.remove('hidden'); badge.innerText = `위치없음 ${noLoc}`; }
        else badge.classList.add('hidden');

        renderStatsTree();
        applyListFilter();
        updateSelectionSummary();
        if (showZoneCenters) renderZoneCenters();
        saveToStorage();
    }

    function fmtDist(m) {
        if (m == null) return '';
        return m >= 1000 ? (m / 1000).toFixed(1) + 'km' : Math.round(m) + 'm';
    }

    function renderStatsTree() {
        const container = document.getElementById('statsTreeContainer');
        container.innerHTML = '';
        if (!allData.length) {
            container.innerHTML = '<div class="text-center py-10 text-gray-400 text-xs">데이터를 업로드하세요.</div>';
            return;
        }
        const frag = document.createDocumentFragment();

        Object.keys(stats).sort(natCmp).forEach(parish => {
            const pData = stats[parish];
            const baseHex = (() => { const c = getParishColorInfo(parish); return hslToHex(c.h, c.s, c.l); })();
            const members = allData.filter(p => p.parish === parish);
            const isParishChecked = members.length > 0 && members.every(p => p.checked);
            const collapsed = collapsedParishes.has(parish);

            const parishDiv = document.createElement('div');
            parishDiv.className = 'border rounded bg-white overflow-hidden shadow-sm text-sm';

            const head = document.createElement('div');
            head.className = 'flex items-center justify-between p-2 bg-gray-50 border-b';
            const empty = members.length === 0;
            head.innerHTML = `
                <div class="flex items-center gap-2 min-w-0">
                    <input type="checkbox" ${isParishChecked ? 'checked' : ''} ${empty ? 'disabled' : ''} data-level="parish" data-parish="${esc(parish)}" class="rounded text-blue-600 focus:ring-0 disabled:opacity-30">
                    <span class="w-3 h-3 rounded-full shadow-sm shrink-0" style="background-color:${baseHex}"></span>
                    <button data-act="collapse" data-parish="${esc(parish)}" class="font-bold ${empty ? 'text-gray-400' : 'text-gray-800'} truncate hover:text-blue-600">
                        <i class="fa-solid fa-chevron-${collapsed ? 'right' : 'down'} text-[10px] text-gray-400 mr-1"></i>${esc(parish)}
                    </button>
                </div>
                <div class="flex items-center gap-1 shrink-0">
                    <button data-act="focus-parish" data-parish="${esc(parish)}" class="text-gray-400 hover:text-blue-600 px-1" title="이 교구로 지도 이동"><i class="fa-solid fa-magnifying-glass-location"></i></button>
                    <span class="text-xs font-bold bg-white border px-1.5 rounded ${empty ? 'text-gray-300' : ''}">${pData.total}명</span>
                </div>`;
            parishDiv.appendChild(head);

            if (!collapsed) {
                const zonesDiv = document.createElement('div');
                zonesDiv.className = 'divide-y divide-gray-100';
                Object.keys(pData.zones).sort(natCmp).forEach(zone => {
                    const zData = pData.zones[zone];
                    const zMembers = allData.filter(p => p.parish === parish && p.zone === zone);
                    const isZoneChecked = zMembers.length > 0 && zMembers.every(p => p.checked);

                    let groupsHtml = '';
                    Object.keys(zData.groups).sort(natCmp).forEach(group => {
                        const gMembers = zMembers.filter(p => p.group === group);
                        const isGroupChecked = gMembers.every(p => p.checked);
                        groupsHtml += `
                            <label class="flex items-center gap-1 bg-gray-50 px-1.5 py-0.5 rounded border text-[11px] text-gray-600 whitespace-nowrap cursor-pointer">
                                <input type="checkbox" ${isGroupChecked ? 'checked' : ''} data-level="group" data-parish="${esc(parish)}" data-zone="${esc(zone)}" data-group="${esc(group)}" class="w-3 h-3 rounded text-blue-600">
                                <span>${esc(group)} ${zData.groups[group]}</span>
                            </label>`;
                    });

                    const zoneDiv = document.createElement('div');
                    zoneDiv.className = 'p-2 pl-4';
                    const zEmpty = zMembers.length === 0;
                    zoneDiv.innerHTML = `
                        <div class="flex items-center gap-2 mb-1 min-w-0">
                            <input type="checkbox" ${isZoneChecked ? 'checked' : ''} ${zEmpty ? 'disabled' : ''} data-level="zone" data-parish="${esc(parish)}" data-zone="${esc(zone)}" class="rounded text-blue-600 focus:ring-0 disabled:opacity-30">
                            <span class="font-semibold ${zEmpty ? 'text-gray-400' : 'text-gray-700'} text-xs truncate">└ ${esc(zone)}</span>
                            <span class="text-[10px] text-gray-400 shrink-0">${zEmpty ? '(비어 있음)' : `(${zData.total}명${zData.avgDist != null ? ' · 평균 ' + fmtDist(zData.avgDist) : ''})`}</span>
                            <button data-act="focus-zone" data-parish="${esc(parish)}" data-zone="${esc(zone)}" class="ml-auto text-gray-300 hover:text-blue-600 shrink-0" title="이 구역으로 지도 이동"><i class="fa-solid fa-magnifying-glass-location text-xs"></i></button>
                        </div>
                        <div class="flex flex-wrap gap-1 pl-5">${groupsHtml}</div>`;
                    zonesDiv.appendChild(zoneDiv);
                });
                parishDiv.appendChild(zonesDiv);
            }
            frag.appendChild(parishDiv);
        });
        container.appendChild(frag);
    }

    /** 통계 트리 이벤트 위임 (인라인 onclick 제거 → 따옴표 포함 이름도 안전) */
    function initStatsDelegation() {
        const c = document.getElementById('statsTreeContainer');
        c.addEventListener('change', e => {
            const cb = e.target.closest('input[data-level]');
            if (!cb) return;
            toggleGroup(cb.dataset.level, cb.dataset.parish, cb.dataset.zone, cb.dataset.group, cb.checked);
        });
        c.addEventListener('click', e => {
            const btn = e.target.closest('button[data-act]');
            if (!btn) return;
            const { act, parish, zone } = btn.dataset;
            if (act === 'collapse') {
                collapsedParishes.has(parish) ? collapsedParishes.delete(parish) : collapsedParishes.add(parish);
                renderStatsTree();
            } else if (act === 'focus-parish') {
                fitToPeople(allData.filter(p => p.parish === parish));
            } else if (act === 'focus-zone') {
                fitToPeople(allData.filter(p => p.parish === parish && p.zone === zone));
            }
        });
    }

    function toggleStatsCollapse() {
        const sec = document.getElementById('statsSection');
        const chev = document.getElementById('statsChevron');
        const treeEl = document.getElementById('statsTreeContainer');
        const hidden = treeEl.classList.toggle('hidden');
        sec.classList.toggle('h-[35%]', !hidden);
        chev.className = `fa-solid fa-chevron-${hidden ? 'right' : 'down'} text-xs text-gray-400`;
    }

    // ------------------------------- 체크(표시) 상태 -------------------------------
    function toggleGroup(level, parish, zone, group, isChecked) {
        allData.forEach(p => {
            let match = false;
            if (level === 'parish') match = p.parish === parish;
            else if (level === 'zone') match = p.parish === parish && p.zone === zone;
            else if (level === 'group') match = p.parish === parish && p.zone === zone && p.group === group;
            if (match) { p.checked = isChecked; updateMarkerVisibility(p); }
        });
        renderStatsTree(); applyListFilter(); updateSelectionSummary(); saveToStorage();
    }

    function togglePerson(id, isChecked) {
        const p = allData.find(x => x.id === id);
        if (!p) return;
        p.checked = isChecked;
        updateMarkerVisibility(p);
        renderStatsTree(); updateSelectionSummary(); saveToStorage();
        document.getElementById('listCheckAll').checked = getFilteredData().every(x => x.checked);
    }

    function toggleAll(isChecked) {
        allData.forEach(p => { p.checked = isChecked; updateMarkerVisibility(p); });
        document.getElementById('listCheckAll').checked = isChecked;
        renderStatsTree(); applyListFilter(); updateSelectionSummary(); saveToStorage();
    }

    function toggleListVisible(isChecked) {
        getFilteredData().forEach(p => { p.checked = isChecked; updateMarkerVisibility(p); });
        document.getElementById('statsCheckAll').checked = allData.length > 0 && allData.every(p => p.checked);
        renderStatsTree(); applyListFilter(); updateSelectionSummary(); saveToStorage();
    }

    function updateSelectionSummary() {
        const checked = allData.filter(p => p.checked);
        document.getElementById('selectedCount').innerText = checked.length;
        const container = document.getElementById('selectionTags');
        container.innerHTML = '';
        if (!checked.length) { container.innerHTML = '<span class="text-gray-400 px-1">선택된 인원이 없습니다.</span>'; return; }

        const byZone = {};
        checked.forEach(p => {
            const k = `${p.parish} ${p.zone}`;
            byZone[k] = (byZone[k] || 0) + 1;
        });
        Object.keys(byZone).sort(natCmp).forEach(k => {
            const tag = document.createElement('span');
            tag.className = 'bg-white text-blue-600 border border-blue-200 px-1.5 py-0.5 rounded shadow-sm font-medium';
            tag.innerText = `${k} ${byZone[k]}`;
            container.appendChild(tag);
        });
        document.getElementById('statsCheckAll').checked = checked.length === allData.length;
    }

    // ------------------------------- 명단 렌더 -------------------------------
