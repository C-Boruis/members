    function initListDelegation() {
        const tbody = document.getElementById('personList');
        tbody.addEventListener('change', e => {
            const cb = e.target.closest('input[data-id]');
            if (cb) togglePerson(parseInt(cb.dataset.id, 10), cb.checked);
        });
        tbody.addEventListener('click', e => {
            const edit = e.target.closest('button[data-edit]');
            if (edit) { openEditModal(parseInt(edit.dataset.edit, 10)); return; }
            const pin = e.target.closest('button[data-pin]');
            if (pin) { startPinMode(parseInt(pin.dataset.pin, 10)); return; }
            const cell = e.target.closest('td[data-focus]');
            if (cell) highlightPerson(parseInt(cell.dataset.focus, 10));
        });
    }

    function updatePrintSubtitle() {
        const checked = allData.filter(p => p.checked);
        const zones = [...new Set(checked.map(p => `${p.parish} ${p.zone}`))].sort(natCmp);
        const scope = zones.length === 0 ? ''
            : zones.length <= 4 ? zones.join(' · ')
                : `${[...new Set(checked.map(p => p.parish))].sort(natCmp).join(' · ')} (${zones.length}개 구역)`;
        const d = new Date();
        const stamp = `${d.getFullYear()}. ${d.getMonth() + 1}. ${d.getDate()} 기준`;
        const line = (scope ? scope + ' · ' : '') + `${checked.length}명 · ${stamp}`;
        document.getElementById('printSubtitle').innerText = line;
        document.getElementById('printMapSubtitle').innerText = line;
    }

    function adjustColumnWidths() {
        const ths = document.querySelectorAll('#resizeTable th[data-col]');
        const ctx = document.createElement('canvas').getContext('2d');
        ctx.font = "14px 'Noto Sans KR', sans-serif";
        const sample = allData.slice(0, 80);

        ths.forEach(th => {
            const key = th.getAttribute('data-col');
            let w = Math.max(50, ctx.measureText(th.innerText).width + 24);
            sample.forEach(p => {
                let t = '';
                if (key === 'parish_zone') t = `${p.parish} ${p.zone}`;
                else if (key === 'name') t = p.name;
                else if (key === 'role') t = p.role;
                else if (key === 'address') t = p.address || '주소 없음';
                w = Math.max(w, ctx.measureText(t).width + 24);
            });
            th.style.width = Math.ceil(key === 'address' ? Math.min(w, 400) : Math.min(w, 150)) + 'px';
        });
    }

    // ------------------------------- 지도 이동 / 하이라이트 -------------------------------
    function fitToPeople(people, padding) {
        const pts = people.filter(p => p.lat != null);
        if (!pts.length || !map) { toast('위치 정보가 있는 인원이 없습니다.', 'warn'); return false; }
        if (pts.length === 1) {
            map.setLevel(4);
            map.setCenter(new kakao.maps.LatLng(pts[0].lat, pts[0].lng));
            return true;
        }
        const b = new kakao.maps.LatLngBounds();
        pts.forEach(p => b.extend(new kakao.maps.LatLng(p.lat, p.lng)));
        // 핀은 좌표 위로 45px, 이름표는 좌표 오른쪽으로 뻗으므로 그만큼 여백을 더 준다
        const pad = padding || 0;
        const labelled = settings.markerLabel === 'zone_name';
        map.setBounds(b, pad + 52, pad + (labelled ? 140 : 30), pad + 12, pad + 30);
        return true;
    }

    function fitToVisible() { fitToPeople(allData.filter(p => p.checked)); }

    function highlightPerson(id) {
        const person = allData.find(p => p.id === id);
        if (!person) return;

        if (selectedMarker) {
            const prev = allData.find(p => p.marker === selectedMarker);
            if (prev && prev.marker) { prev.marker.setImage(prev.originalImage); prev.marker.setZIndex(1); }
        }
        selectedMarker = null;

        if (person.marker) {
            if (!person.checked) {
                person.checked = true;
                updateMarkerVisibility(person);
                updateSelectionSummary(); renderStatsTree();
                const cb = document.querySelector(`#row-${id} input[data-id]`);
                if (cb) cb.checked = true;
            }
            person.marker.setImage(createSvgMarker('#111827', person.markerText, true, markerLabelFor(person)));
            person.marker.setZIndex(999);
            selectedMarker = person.marker;
            map.panTo(person.marker.getPosition());
        } else {
            toast('위치 정보가 없습니다. 주소를 수정하거나 핀 버튼으로 직접 지정하세요.', 'warn');
        }

        document.querySelectorAll('.selected-row').forEach(el => el.classList.remove('selected-row'));
        const row = document.getElementById(`row-${id}`);
        if (row) { row.classList.add('selected-row'); row.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    }

    // ------------------------------- 영역 선택 (올가미 / 다각형) -------------------------------
    let areaMode = null;                // 'lasso' | 'poly' | null
    let areaPath = [];                  // [{lat,lng}]
    let areaLine = null, areaPoly = null, areaDots = [];
    let lassoDragging = false;

    function initMapEvents() {
        kakao.maps.event.addListener(map, 'mousedown', onMapMouseDown);
        kakao.maps.event.addListener(map, 'mousemove', onMapMouseMove);
        kakao.maps.event.addListener(map, 'mouseup', onMapMouseUp);
        kakao.maps.event.addListener(map, 'click', onMapClick);
    }

    function startArea(mode) {
        if (!map) return;
        if (!allData.some(p => p.lat != null)) { toast('먼저 명단을 불러오세요.', 'warn'); return; }
        cancelPinMode();
        clearArea();
        areaMode = mode;
        areaPath = [];
        document.getElementById('map').parentElement.classList.add('map-crosshair');
        document.getElementById('areaPanel').classList.remove('hidden');
        document.getElementById('areaHint').innerHTML = mode === 'lasso'
            ? '<b>올가미</b> — 지도를 <b>드래그</b>해 감쌀 영역을 그리세요. 손을 떼면 자동으로 선택됩니다.'
            : '<b>다각형</b> — 지도를 <b>탭/클릭</b>해 꼭짓점을 3개 이상 찍고 <b>완료</b>를 누르세요.';
        document.getElementById(mode === 'lasso' ? 'btnLasso' : 'btnPoly').classList.add('bg-blue-600', 'text-white');
        if (mode === 'lasso') { map.setDraggable(false); }
    }

    function cancelArea() {
        if (!areaMode) return;
        const m = areaMode;
        areaMode = null; lassoDragging = false;
        if (map) { map.setDraggable(true); map.setZoomable(true); }
        document.getElementById('map').parentElement.classList.remove('map-crosshair');
        document.getElementById('areaPanel').classList.add('hidden');
        ['btnLasso', 'btnPoly'].forEach(id => document.getElementById(id).classList.remove('bg-blue-600', 'text-white'));
        clearTempShapes();
        areaPath = [];
    }

    function clearTempShapes() {
        if (areaLine) { areaLine.setMap(null); areaLine = null; }
        areaDots.forEach(d => d.setMap(null)); areaDots = [];
    }

    function clearArea() {
        clearTempShapes();
        if (areaPoly) { areaPoly.setMap(null); areaPoly = null; }
    }

    function drawTempLine() {
        clearTempShapes();
        if (areaPath.length < 2) return;
        areaLine = new kakao.maps.Polyline({
            map, path: areaPath.map(p => new kakao.maps.LatLng(p.lat, p.lng)),
            strokeWeight: 3, strokeColor: '#2563eb', strokeOpacity: 0.9, strokeStyle: 'solid'
        });
    }

    function drawVertexDots() {
        areaDots.forEach(d => d.setMap(null)); areaDots = [];
        areaPath.forEach(p => {
            const c = new kakao.maps.Circle({
                map, center: new kakao.maps.LatLng(p.lat, p.lng), radius: 6,
                strokeWeight: 2, strokeColor: '#1d4ed8', fillColor: '#ffffff', fillOpacity: 1
            });
            areaDots.push(c);
        });
    }

    function onMapMouseDown(e) {
        if (areaMode !== 'lasso') return;
        lassoDragging = true;
        areaPath = [{ lat: e.latLng.getLat(), lng: e.latLng.getLng() }];
    }

    function onMapMouseMove(e) {
        if (areaMode !== 'lasso' || !lassoDragging) return;
        areaPath.push({ lat: e.latLng.getLat(), lng: e.latLng.getLng() });
        if (areaPath.length % 2 === 0) drawTempLine();
    }

    function onMapMouseUp() {
        if (areaMode !== 'lasso' || !lassoDragging) return;
        lassoDragging = false;
        finishArea();
    }

    function onMapClick(e) {
        if (pinTargetId !== null) { applyPin(e.latLng.getLat(), e.latLng.getLng()); return; }
        if (areaMode !== 'poly') return;
        areaPath.push({ lat: e.latLng.getLat(), lng: e.latLng.getLng() });
        drawTempLine(); drawVertexDots();
        document.getElementById('areaHint').innerHTML =
            `<b>다각형</b> — 꼭짓점 ${areaPath.length}개. 3개 이상 찍고 <b>완료</b>를 누르세요.`;
    }

    function finishArea() {
        if (!areaMode) return;
        const path = areaPath.slice();
        const mode = areaMode;
        cancelArea();

        if (path.length < 3) { toast('영역이 너무 작습니다. 다시 그려주세요.', 'warn'); return; }

        if (areaPoly) areaPoly.setMap(null);
        areaPoly = new kakao.maps.Polygon({
            map, path: path.map(p => new kakao.maps.LatLng(p.lat, p.lng)),
            strokeWeight: 2, strokeColor: '#2563eb', strokeOpacity: 0.9,
            fillColor: '#3b82f6', fillOpacity: 0.15
        });

        const inside = allData.filter(p => p.lat != null && pointInPolygon(p.lat, p.lng, path));
        if (!inside.length) { toast('영역 안에 인원이 없습니다.', 'warn'); return; }

        const insideIds = new Set(inside.map(p => p.id));
        allData.forEach(p => { p.checked = insideIds.has(p.id); updateMarkerVisibility(p); });

        renderStatsTree(); applyListFilter(); updateSelectionSummary(); saveToStorage();
        toast(`${inside.length}명 선택됨 — '일괄 편성'으로 구역을 지정하세요.`, 'ok');
        openBulkModal();
    }

    /** Ray casting 알고리즘 */
    function pointInPolygon(lat, lng, poly) {
        let inside = false;
        for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
            const xi = poly[i].lng, yi = poly[i].lat, xj = poly[j].lng, yj = poly[j].lat;
            if (((yi > lat) !== (yj > lat)) && (lng < (xj - xi) * (lat - yi) / (yj - yi) + xi)) inside = !inside;
        }
        return inside;
    }

    // ------------------------------- 구역 중심점 오버레이 -------------------------------
    let showZoneCenters = false;
    let zoneCenterOverlays = [];

    function toggleZoneCenters() {
        showZoneCenters = !showZoneCenters;
        document.getElementById('btnZoneCenter').classList.toggle('bg-blue-600', showZoneCenters);
        document.getElementById('btnZoneCenter').classList.toggle('text-white', showZoneCenters);
        renderZoneCenters();
    }

    function renderZoneCenters() {
        zoneCenterOverlays.forEach(o => o.setMap(null));
        zoneCenterOverlays = [];
        if (!showZoneCenters || !map) return;
        Object.keys(stats).forEach(parish => {
            Object.keys(stats[parish].zones).forEach(zone => {
                const Z = stats[parish].zones[zone];
                if (!Z.center) return;
                const el = document.createElement('div');
                el.className = 'zone-center-label';
                el.innerText = `${parish} ${zone} (${Z.total})`;
                const ov = new kakao.maps.CustomOverlay({
                    map, position: new kakao.maps.LatLng(Z.center[0], Z.center[1]),
                    content: el, yAnchor: 0.5, zIndex: 500
                });
                zoneCenterOverlays.push(ov);
            });
        });
    }

    // ------------------------------- 수동 위치 지정 -------------------------------
    let pinTargetId = null;

    function startPinMode(id) {
        const p = allData.find(x => x.id === id);
        if (!p) return;
        cancelArea();
        pinTargetId = id;
        document.getElementById('map').parentElement.classList.add('map-crosshair');
        document.getElementById('pinPanel').classList.remove('hidden');
        document.getElementById('pinHint').innerHTML =
            `<b>${esc(p.name)}</b> 님의 위치를 지도에서 <b>클릭/탭</b>해 지정하세요.`;
    }

    function cancelPinMode() {
        if (pinTargetId === null) return;
        pinTargetId = null;
        document.getElementById('map').parentElement.classList.remove('map-crosshair');
        document.getElementById('pinPanel').classList.add('hidden');
    }

    function applyPin(lat, lng) {
        const p = allData.find(x => x.id === pinTargetId);
        cancelPinMode();
        if (!p) return;
        pushUndo();
        p.lat = lat; p.lng = lng;
        syncMarker(p);
        updateStatsAndUI();
        toast(`${p.name} 님의 위치를 지정했습니다.`, 'ok');
        highlightPerson(p.id);
    }

    // ------------------------------- 실행 취소 -------------------------------
    function snapshot() {
        return allData.map(p => ({
            id: p.id, name: p.name, address: p.address, parish: p.parish, zone: p.zone,
            group: p.group, role: p.role, attendance: p.attendance,
            lat: p.lat, lng: p.lng, checked: p.checked
        }));
    }

    function pushUndo() {
        undoStack.push(snapshot());
        if (undoStack.length > UNDO_LIMIT) undoStack.shift();
        refreshUndoBtn();
    }

    function refreshUndoBtn() { document.getElementById('undoBtn').disabled = undoStack.length === 0; }

    function undo() {
        if (!undoStack.length) return;
        const snap = undoStack.pop();
        refreshUndoBtn();
        hydrate(snap);
        toast('되돌렸습니다.', 'ok');
    }

    /** 스냅샷(또는 저장 데이터)으로 allData를 재구성한다. */
    function hydrate(records) {
        allData.forEach(p => { if (p.marker) p.marker.setMap(null); });
        selectedMarker = null;
        allData = records.map(r => ({
            ...r,
            marker: null,
            markerText: makeMarkerText(r.zone),
            checked: r.checked !== false
        }));
        nextId = allData.reduce((m, p) => Math.max(m, p.id), 0) + 1;
        allData.forEach(syncMarker);
        populateFilters();
        updateStatsAndUI();
    }

    // ------------------------------- 개별 수정 / 추가 / 삭제 -------------------------------
    function openEditModal(id) {
        const p = allData.find(x => x.id === id);
        if (!p) return;
        document.getElementById('editModalTitle').innerHTML = '<i class="fa-solid fa-user-pen mr-2 text-blue-600"></i>정보 수정';
        document.getElementById('editDeleteBtn').classList.remove('hidden');
        document.getElementById('editId').value = p.id;
        document.getElementById('editName').value = p.name;
        document.getElementById('editRole').value = p.role;
        document.getElementById('editParish').value = p.parish;
        document.getElementById('editZone').value = p.zone;
        document.getElementById('editGroup').value = p.group;
        document.getElementById('editAddress').value = p.address;
        document.getElementsByName('editAttendance').forEach(r => r.checked = (r.value === p.attendance));
        showModal('editModal');
    }

    function addPerson() {
        pushUndo();
        const last = allData[allData.length - 1];
        const p = {
            id: nextId++, name: '새 인원', address: '',
            parish: last ? last.parish : '1교구', zone: last ? last.zone : '1구역',
            group: last ? last.group : '기타', role: '-', attendance: 'X',
            lat: null, lng: null, marker: null, markerText: '·', checked: true
        };
        allData.push(p);
        populateFilters();
        updateStatsAndUI();
        openEditModal(p.id);
    }

    function deleteCurrentPerson() {
        const id = parseInt(document.getElementById('editId').value, 10);
        const p = allData.find(x => x.id === id);
        if (!p) return;
        if (!confirm(`'${p.name}' 님을 명단에서 삭제할까요?`)) return;
        pushUndo();
        if (p.marker) p.marker.setMap(null);
        if (selectedMarker === p.marker) selectedMarker = null;
        allData = allData.filter(x => x.id !== id);
        closeEditModal();
        populateFilters();
        updateStatsAndUI();
        toast('삭제했습니다.', 'ok');
    }

    function deleteChecked() {
        const targets = allData.filter(p => p.checked);
        if (!targets.length) { toast('체크된 인원이 없습니다.', 'warn'); return; }
        if (!confirm(`체크된 ${targets.length}명을 명단에서 삭제할까요?`)) return;
        pushUndo();
        targets.forEach(p => { if (p.marker) p.marker.setMap(null); });
        selectedMarker = null;
        allData = allData.filter(p => !p.checked);
        populateFilters();
        updateStatsAndUI();
        toast(`${targets.length}명 삭제했습니다.`, 'ok');
    }

    function closeEditModal() { hideModal('editModal'); }

    async function saveEdit() {
        const id = parseInt(document.getElementById('editId').value, 10);
        const p = allData.find(x => x.id === id);
        if (!p) return;
        pushUndo();

        const newAddress = S(document.getElementById('editAddress').value);
        const addressChanged = p.address !== newAddress;

        p.name = S(document.getElementById('editName').value) || '미상';
        p.role = S(document.getElementById('editRole').value) || '-';
        p.parish = S(document.getElementById('editParish').value) || '미지정';
        p.zone = S(document.getElementById('editZone').value) || '미지정';
        p.group = S(document.getElementById('editGroup').value) || '기타';
        const att = document.querySelector('input[name="editAttendance"]:checked');
        p.attendance = att ? att.value : 'X';
        p.markerText = makeMarkerText(p.zone);

        if (addressChanged) {
            p.address = newAddress;
            p.lat = p.lng = null;
            if (newAddress) {
                setStatus('주소 검색 중...');
                const r = await geocode(newAddress);
                if (r) { p.lat = r.lat; p.lng = r.lng; }
                else toast('주소를 찾지 못했습니다. 핀 버튼으로 직접 지정할 수 있습니다.', 'warn');
                setStatus('준비됨');
            }
        }

        syncMarker(p);
        closeEditModal();
        populateFilters();
        updateStatsAndUI();
        if (p.lat != null) highlightPerson(p.id);
        toast('수정했습니다.', 'ok');
    }

    // ------------------------------- 일괄 편성 -------------------------------
    function openBulkModal() {
        const n = allData.filter(p => p.checked).length;
        if (!n) { toast('체크된 인원이 없습니다.', 'warn'); return; }
        document.getElementById('bulkCount').innerText = n;
        showModal('bulkModal');
    }

    function closeBulkModal() { hideModal('bulkModal'); }

    function applyBulk() {
        const targets = allData.filter(p => p.checked);
        if (!targets.length) { closeBulkModal(); return; }

        const useP = document.getElementById('bulkUseParish').checked;
        const useZ = document.getElementById('bulkUseZone').checked;
        const useG = document.getElementById('bulkUseGroup').checked;
        const useR = document.getElementById('bulkUseRole').checked;
        const useA = document.getElementById('bulkUseAtt').checked;
        if (!useP && !useZ && !useG && !useR && !useA) { toast('변경할 항목을 체크하세요.', 'warn'); return; }

        const vP = S(document.getElementById('bulkParish').value);
        const vZ = S(document.getElementById('bulkZone').value);
        const vG = S(document.getElementById('bulkGroup').value);
        const vR = S(document.getElementById('bulkRole').value);
        const vA = document.getElementById('bulkAtt').value;
        if ((useP && !vP) || (useZ && !vZ) || (useG && !vG) || (useR && !vR)) {
            toast('체크한 항목의 값을 입력하세요.', 'warn'); return;
        }

        pushUndo();
        targets.forEach(p => {
            if (useP) p.parish = vP;
            if (useZ) { p.zone = vZ; p.markerText = makeMarkerText(vZ); }
            if (useG) p.group = vG;
            if (useR) p.role = vR;
            if (useA) p.attendance = vA;
            syncMarker(p);
        });

        closeBulkModal();
        populateFilters();
        updateStatsAndUI();
        toast(`${targets.length}명을 일괄 변경했습니다. (Ctrl+Z로 되돌리기)`, 'ok');
    }

    function showModal(id) { const m = document.getElementById(id); m.classList.remove('hidden'); m.classList.add('flex'); }
    function hideModal(id) { const m = document.getElementById(id); m.classList.add('hidden'); m.classList.remove('flex'); }

    // ------------------------------- 저장 / 복원 -------------------------------
    const saveToStorage = debounce(() => {
        try {
            localStorage.setItem(LS_DATA, JSON.stringify({ savedAt: Date.now(), records: snapshot() }));
        } catch (e) { /* 용량 초과 등은 무시 */ }
    }, 700);

    function restoreFromStorage() {
        let saved = null;
        try { saved = JSON.parse(localStorage.getItem(LS_DATA) || 'null'); } catch (e) { }
        if (!saved || !saved.records || !saved.records.length) return;
        hydrate(saved.records);
        adjustColumnWidths();
        const when = new Date(saved.savedAt);
        setStatus(`이전 작업 복원됨 · ${allData.length}명`);
        toast(`이전 작업을 복원했습니다 (${when.getMonth() + 1}/${when.getDate()} ${String(when.getHours()).padStart(2, '0')}:${String(when.getMinutes()).padStart(2, '0')}).`, 'ok');
    }

    function resetAll() {
        if (!confirm('모든 데이터를 지우고 초기화할까요?\n(저장된 자동복원 데이터도 함께 삭제됩니다)')) return;
        allData.forEach(p => { if (p.marker) p.marker.setMap(null); });
        allData = [];
        stats = {};
        dynamicColors = {};
        selectedMarker = null;
        nextId = 1;
        undoStack = []; refreshUndoBtn();
        collapsedParishes.clear();
        sortKey = null; sortDir = 1;
        document.querySelectorAll('#resizeTable .sort-ind').forEach(s => s.innerHTML = '');
        clearArea();
        cancelArea(); cancelPinMode();
        showZoneCenters = false; renderZoneCenters();
        document.getElementById('btnZoneCenter').classList.remove('bg-blue-600', 'text-white');

        document.getElementById('filterName').value = '';
        document.getElementById('filterNoLoc').checked = false;
        document.getElementById('statsCheckAll').checked = true;
        document.getElementById('listCheckAll').checked = true;
        document.getElementById('personList').innerHTML = '';
        document.getElementById('noLocBadge').classList.add('hidden');

        try { localStorage.removeItem(LS_DATA); } catch (e) { }
        populateFilters();
        updateStatsAndUI();
        setStatus('준비됨');
        toast('초기화했습니다.', 'ok');
    }

    // ------------------------------- 설정 -------------------------------
    const clampInt = (v, lo, hi, fb) => {
        const n = parseInt(v, 10);
        return isNaN(n) ? fb : Math.min(hi, Math.max(lo, n));
    };

    /** 설정상의 교구 이름 목록 (`1교구`…) + 명단에만 있는 교구 이름 */
    function settingsParishNames(count) {
        const n = count === undefined ? settings.parishCount : count;
        const numbered = Array.from({ length: n }, (_, i) => `${i + 1}교구`);
        const extra = [...new Set(allData.map(p => p.parish))].filter(p => !numbered.includes(p)).sort(natCmp);
        return [...numbered, ...extra];
    }

    function settingsZoneNames() {
        return Array.from({ length: settings.zoneCount }, (_, i) => `${i + 1}구역`);
    }

    function openSettings() {
        document.getElementById('setParishCount').value = settings.parishCount;
        document.getElementById('setZoneCount').value = settings.zoneCount;
        document.getElementById('setShowEmpty').checked = settings.showEmptyZones;
        document.getElementsByName('setMarkerLabel').forEach(r => r.checked = (r.value === settings.markerLabel));
        renderColorRows();
        showModal('settingsModal');
    }

    function renderColorRows() {
        const box = document.getElementById('setColorRows');
        const count = clampInt(document.getElementById('setParishCount').value, 1, 20, settings.parishCount);
        const prev = {};
        box.querySelectorAll('input[type="color"]').forEach(i => prev[i.dataset.parish] = i.value);

        box.innerHTML = '';
        settingsParishNames(count).forEach(name => {
            const hex = prev[name] || settings.parishColors[name] || defaultColorHex(name);
            const row = document.createElement('label');
            row.className = 'flex items-center gap-2 border rounded px-2 py-1.5 bg-gray-50 cursor-pointer';
            row.innerHTML = `<input type="color" value="${hex}" data-parish="${esc(name)}" class="w-8 h-7 border rounded cursor-pointer bg-white shrink-0">
                <span class="text-sm text-gray-700 truncate">${esc(name)}</span>
                <span class="ml-auto text-[10px] text-gray-400 shrink-0">${allData.filter(p => p.parish === name).length}명</span>`;
            box.appendChild(row);
        });
    }

    function saveSettings() {
        settings.parishCount = clampInt(document.getElementById('setParishCount').value, 1, 20, 8);
        settings.zoneCount = clampInt(document.getElementById('setZoneCount').value, 1, 20, 5);
        settings.showEmptyZones = document.getElementById('setShowEmpty').checked;
        const picked = [...document.getElementsByName('setMarkerLabel')].find(r => r.checked);
        settings.markerLabel = picked ? picked.value : 'zone';
        settings.parishColors = {};
        document.querySelectorAll('#setColorRows input[type="color"]').forEach(i => {
            settings.parishColors[i.dataset.parish] = i.value;
        });
        persistSettings();
        applySettings();
        hideModal('settingsModal');
        toast('설정을 저장했습니다.', 'ok');
    }

    function resetSettings() {
        if (!confirm('설정을 기본값으로 되돌릴까요?')) return;
        settings = defaultSettings();
        persistSettings();
        applySettings();
        openSettings();
        toast('기본값으로 되돌렸습니다.', 'ok');
    }

    /** 색상·마커 표시·편성 규모 변경을 화면 전체에 반영 */
    function applySettings() {
        dynamicColors = {};
        allData.forEach(syncMarker);
        populateFilters();
        updateStatsAndUI();
    }

    // ------------------------------- 인쇄 -------------------------------
    const sleep = ms => new Promise(r => setTimeout(r, ms));

    // 인쇄 여백을 뺀 A4 세로 용지의 지도 영역 비율 (190mm x 250mm)
    const A4_MAP_RATIO = 190 / 250;

    /**
     * 체크된 인원만 인쇄한다.
     * 1쪽 = 체크된 인원이 모두 들어오도록 축소/확대한 지도, 2쪽부터 = 명단.
     * 인쇄 CSS에서 지도 크기가 바뀌면 카카오맵이 타일을 다시 받지 못하므로,
     * 미리 화면상의 지도를 A4 비율로 맞춰 타일을 받아둔 뒤 인쇄한다.
     */
    async function printReport() {
        const checked = allData.filter(p => p.checked);
        if (!checked.length) { toast('체크된 인원이 없습니다. 인쇄할 인원을 선택하세요.', 'warn'); return; }

        const mc = document.getElementById('map-container');
        const prevW = mc.style.width, prevH = mc.style.height;

        // 명단은 체크된 인원만, 교구/구역 순으로
        renderPersonList(checked.slice().sort((a, b) => compareBy('parish_zone', a, b)));
        updatePrintSubtitle();

        document.body.classList.add('printing');
        const h = Math.max(560, window.innerHeight - 40);
        mc.style.height = h + 'px';
        mc.style.width = Math.round(h * A4_MAP_RATIO) + 'px';

        setStatus('인쇄 준비 중...');
        relayoutMap();
        await sleep(150);

        const located = checked.filter(p => p.lat != null);
        if (located.length) fitToPeople(located, 45);
        await sleep(950);                       // 지도 타일 로딩 대기

        window.print();

        // 원상 복구
        document.body.classList.remove('printing');
        mc.style.width = prevW; mc.style.height = prevH;
        relayoutMap();
        applyListFilter();
        setStatus('준비됨');

        const missing = checked.length - located.length;
        if (missing) toast(`${missing}명은 위치 정보가 없어 지도에 표시되지 않았습니다. (명단에는 포함)`, 'warn');
    }

    // ------------------------------- 레이아웃 -------------------------------
    function relayoutMap() {
        if (!map) return;
        const c = map.getCenter();
        map.relayout();
        map.setCenter(c);
    }

    function initTableResizer() {
        document.querySelectorAll('#resizeTable th').forEach(col => {
            const resizer = col.querySelector('.resizer');
            if (!resizer) return;
            let x = 0, w = 0;
            const move = e => { col.style.width = Math.max(40, w + (e.clientX - x)) + 'px'; };
            const up = () => {
                document.removeEventListener('mousemove', move);
                document.removeEventListener('mouseup', up);
                resizer.classList.remove('resizing');
            };
            resizer.addEventListener('mousedown', e => {
                e.stopPropagation();
                x = e.clientX;
                w = parseInt(window.getComputedStyle(col).width, 10);
                document.addEventListener('mousemove', move);
                document.addEventListener('mouseup', up);
                resizer.classList.add('resizing');
            });
        });
    }

    function initLayoutResizer() {
        const resizer = document.getElementById('layout-resizer');
        const leftPanel = document.getElementById('map-container');
        let dragging = false;

        resizer.addEventListener('mousedown', e => { dragging = true; document.body.style.cursor = 'col-resize'; e.preventDefault(); });
        document.addEventListener('mousemove', e => {
            if (!dragging) return;
            let w = (e.clientX / window.innerWidth) * 100;
            leftPanel.style.width = Math.min(80, Math.max(20, w)) + '%';
        });
        document.addEventListener('mouseup', () => { if (dragging) { dragging = false; document.body.style.cursor = ''; } });

        new ResizeObserver(debounce(relayoutMap, 60)).observe(leftPanel);
    }

    let isMapFullscreen = false, savedMapWidth = '65%';

    function toggleMapFullscreen() {
        const header = document.querySelector('header');
        const rightPanel = document.getElementById('rightPanel');
        const resizer = document.getElementById('layout-resizer');
        const mapContainer = document.getElementById('map-container');
        const exitBtn = document.getElementById('exitFullscreenBtn');

        isMapFullscreen = !isMapFullscreen;
        if (isMapFullscreen) {
            savedMapWidth = mapContainer.style.width || '65%';
            header.classList.add('hidden');
            rightPanel.classList.add('hidden');
            resizer.classList.add('hidden');
            mapContainer.style.width = '100%';
            mapContainer.style.height = '100%';
            exitBtn.classList.remove('hidden');
        } else {
            header.classList.remove('hidden');
            rightPanel.classList.remove('hidden');
            resizer.classList.remove('hidden');
            mapContainer.style.width = savedMapWidth;
            mapContainer.style.height = '';
            exitBtn.classList.add('hidden');
        }
        setTimeout(relayoutMap, 60);
    }

    // Ctrl+P 등으로 직접 인쇄할 때도 명단은 체크된 인원으로 맞춘다 (지도 맞춤은 인쇄 버튼에서만 가능)
    window.addEventListener('beforeprint', () => {
        if (!document.body.classList.contains('printing')) {
            const checked = allData.filter(p => p.checked);
            if (checked.length) renderPersonList(checked.slice().sort((a, b) => compareBy('parish_zone', a, b)));
        }
        updatePrintSubtitle();
        relayoutMap();
    });
    window.addEventListener('afterprint', () => {
        relayoutMap();
        if (!document.body.classList.contains('printing')) applyListFilter();
    });
    </script>
</body>
</html>
